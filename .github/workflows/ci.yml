# CI — テストの門番
#
# 経緯: このリポジトリは dependabot-automerge.yml で非 major の依存更新を
# 自動マージしているが、required status checks が未設定だった。
# 既存の workflow は
#   - codeql.yml   : セキュリティスキャン
#   - pip-audit.yml: 依存の脆弱性スキャン
#   - validate.yml : validator.py --git-diff（差分の自作ルール検査）
# のいずれもビルド・テストの門番ではなく、tests/ (57 テスト) は
# CI で一度も実行されていなかった。つまり依存更新が「テストされずに」
# マージされ得る状態だった（同種の穴で jan-anime-map では版ずれによる
# テスト失敗が長期間気づかれなかった）。
# この workflow の job 名を required status check に登録すること。
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

  # 3.11 以前は f 文字列の字句解析が 3.12 以降と違う（全体が 1 つの文字列トークン）。
  # 3.12 だけで回していたため、PR #97 で f 文字列の式内の eval を見逃す退行が
  # すり抜けた。validate.yml は 3.11 で動くので、同じ版でもテストする。
  # job 名は required check の "test" と別にしてある（必須にするかは別途判断）。
  test-py311:
    name: test (python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q
